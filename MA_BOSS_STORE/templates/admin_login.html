<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion Admin | MA.BOSS</title><script src="https://cdn.tailwindcss.com"></script><meta name="csrf-token" content="{{ csrf_token() }}"></head><body class="min-h-screen bg-[#130519] flex items-center justify-center p-5"><form id="login" class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl"><div class="text-center mb-7"><h1 class="text-3xl font-serif font-bold text-[#1E0B25]">MA.BOSS STORE</h1><p class="text-sm text-gray-500 mt-2">Administration sécurisée</p></div><label class="block text-sm mb-2">Identifiant</label><input id="username" autocomplete="username" required class="w-full border rounded-lg p-3 mb-4"><label class="block text-sm mb-2">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required class="w-full border rounded-lg p-3 mb-5"><button class="w-full bg-[#1E0B25] text-white rounded-lg p-3 font-semibold">Se connecter</button><p id="error" class="text-red-600 text-sm mt-4"></p><a href="/" class="block text-center text-xs text-gray-500 mt-5">Retour à la boutique</a></form><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('meta[name="csrf-token"]').content},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(r.ok)location.href=d.redirect;else document.getElementById('error').textContent=d.error||'Connexion impossible.';});</script></body></html>
