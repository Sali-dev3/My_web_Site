<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | MA.BOSS STORE</title><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"><script src="https://cdn.tailwindcss.com"></script><meta name="csrf-token" content="{{ csrf_token() }}"></head><body class="bg-[#faf7f2] min-h-screen text-slate-800"><header class="bg-[#1E0B25] text-white px-5 py-4"><div class="max-w-7xl mx-auto flex justify-between items-center"><div><h1 class="font-serif text-2xl text-[#D4AF37]">MA.BOSS STORE</h1><p class="text-xs text-white/70">Tableau de bord administrateur</p></div><div class="flex gap-3"><a href="/" class="border border-white/30 rounded-lg px-3 py-2 text-sm">Voir la boutique</a><button id="logout" class="bg-[#D4AF37] text-[#1E0B25] rounded-lg px-3 py-2 text-sm font-bold">Déconnexion</button></div></div></header><main class="max-w-7xl mx-auto p-5 md:p-8"><div class="grid md:grid-cols-3 gap-4 mb-7"><div class="bg-white p-5 rounded-xl shadow-sm"><p class="text-gray-500 text-sm">Produits au catalogue</p><p id="product-count" class="text-3xl font-bold text-[#1E0B25]">0</p></div><div class="bg-white p-5 rounded-xl shadow-sm"><p class="text-gray-500 text-sm">Commandes récentes</p><p id="order-count" class="text-3xl font-bold text-[#1E0B25]">0</p></div><div class="bg-white p-5 rounded-xl shadow-sm"><p class="text-gray-500 text-sm">Commandes payées</p><p id="paid-count" class="text-3xl font-bold text-emerald-700">0</p></div></div><section class="bg-white rounded-2xl shadow-sm p-5 md:p-7 mb-8"><div class="flex flex-wrap justify-between gap-3 items-center mb-5"><div><h2 class="text-xl font-bold text-[#1E0B25]">Catalogue produits</h2><p class="text-xs text-gray-500">Ajoutez, modifiez ou supprimez les articles.</p></div><button id="new-product" class="bg-[#1E0B25] text-white rounded-lg px-4 py-2.5">+ Ajouter un produit</button></div><div id="product-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></section><section class="bg-white rounded-2xl shadow-sm p-5 md:p-7"><h2 class="text-xl font-bold text-[#1E0B25] mb-4">Commandes</h2><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead><tr class="border-b text-gray-500"><th class="p-2">Référence</th><th class="p-2">Client</th><th class="p-2">Montant</th><th class="p-2">Statut</th><th class="p-2">Date</th></tr></thead><tbody id="orders"></tbody></table></div></section></main><div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 overflow-y-auto"><div class="max-w-xl mx-auto bg-white rounded-2xl p-6 my-8"><div class="flex justify-between mb-5"><h2 id="form-title" class="text-xl font-bold">Ajouter un produit</h2><button id="close-modal" class="text-2xl">×</button></div><form id="product-form" method="POST" enctype="multipart/form-data" class="space-y-4"><input type="hidden" id="product-id"><div><label class="text-sm block mb-1">Nom du produit *</label><input id="name" required maxlength="140" class="w-full border rounded-lg p-3"></div><div class="grid grid-cols-2 gap-3"><div><label class="text-sm block mb-1">Prix (FCFA) *</label><input id="price" type="number" min="1" required class="w-full border rounded-lg p-3"></div><div><label class="text-sm block mb-1">Catégorie *</label><select id="category" class="w-full border rounded-lg p-3"><option value="parfum">Parfum</option><option value="vetement">Vêtement</option><option value="accessoire">Accessoire</option><option value="femme">Femme</option><option value="homme">Homme</option><option value="mixte">Mixte</option></select></div></div><div><label class="text-sm block mb-1">Description</label><textarea id="description" rows="3" class="w-full border rounded-lg p-3"></textarea></div><div><label class="text-sm block mb-1">Photo (JPG, PNG, WEBP — 5 Mo max)</label><input id="image" name="photo" type="file" accept="image/*" class="w-full border rounded-lg p-3"><img id="preview" class="hidden mt-3 h-32 w-32 object-cover rounded-xl"></div><div class="flex gap-5 text-sm"><label><input id="popular" type="checkbox"> Populaire</label><label><input id="new" type="checkbox"> Nouveau</label></div><p id="form-error" class="text-sm text-red-600"></p><button class="w-full bg-[#1E0B25] text-white rounded-lg p-3 font-semibold">Enregistrer le produit</button></form></div></div><script src="{{ url_for('static',filename='admin.js') }}?v=2"></script></body></html>
